<!DOCTYPE html>
<html>
<head>
    <title>Dead Stock Detector</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #333;
            color: white;
        }

        .warning {
            color: #b00020;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #555;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<h1>💤 Dead Stock Detector</h1>

<div class="container">

    <table>
        <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Current Stock</th>
            <th>Price</th>
            <th>Status</th>
        </tr>

        {% for product in dead_products %}

        <tr>
            <td>{{ product.name }}</td>
            <td>{{ product.category }}</td>
            <td>{{ product.quantity }}</td>
            <td>₹{{ product.price }}</td>
            <td>
                <span class="warning">
                    ⚠️ No Sales in 30 Days
                </span>
            </td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="5" class="empty">
                ✅ No dead stock detected.
            </td>
        </tr>

        {% endfor %}

    </table>

    <div style="text-align: center;">
        <a href="{% url 'dashboard' %}" class="back">
            🏠 Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
