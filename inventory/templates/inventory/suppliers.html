<!DOCTYPE html>
<html>
<head>
    <title>Suppliers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        .back {
            display: inline-block;
            padding: 10px 18px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<h1>🏢 Supplier Management</h1>

<table>
    <tr>
        <th>Product</th>
        <th>Category</th>
        <th>Supplier</th>
        <th>Quantity</th>
        <th>Price</th>
    </tr>

    {% for product in products %}
    <tr>
        <td>{{ product.name }}</td>
        <td>{{ product.category }}</td>
        <td>{{ product.supplier }}</td>
        <td>{{ product.quantity }}</td>
        <td>₹{{ product.price }}</td>
    </tr>

    {% empty %}
    <tr>
        <td colspan="5">No supplier information available.</td>
    </tr>
    {% endfor %}
</table>

<div style="text-align: center; margin: 30px;">
    <a href="{% url 'dashboard' %}" class="back">
        🏠 Back to Dashboard
    </a>
</div>

</body>
</html>
