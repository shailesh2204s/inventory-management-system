<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .password-box {
            max-width: 400px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background: #555;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="password-box">

    <h1>🔑 Change Password</h1>

    {% if error %}
        <p style="color: red; text-align: center;">
            ⚠️ {{ error }}
        </p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Current Password</label>
        <input type="password"
               name="current_password"
               required>

        <label>New Password</label>
        <input type="password"
               name="new_password"
               required>

        <label>Confirm New Password</label>
        <input type="password"
               name="confirm_password"
               required>

        <button type="submit">
            🔐 Change Password
        </button>
    </form>

    <a href="{% url 'profile' %}" class="back">
        👤 Back to Profile
    </a>

</div>

</body>
</html>
