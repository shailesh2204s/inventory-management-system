 <!DOCTYPE html>
<html>
<head>
    <title>Sales History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        .back {
            display: inline-block;
            padding: 10px 18px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<h1>📋 Sales History</h1>

<table>
    <tr>
        <th>Product</th>
        <th>Quantity Sold</th>
        <th>Total Price</th>
    </tr>

    {% for sale in sales %}
    <tr>
        <td>{{ sale.product.name }}</td>
        <td>{{ sale.quantity }}</td>
        <td>₹{{ sale.total_price }}</td>
    </tr>

    {% empty %}
    <tr>
        <td colspan="3">No sales recorded yet.</td>
    </tr>
    {% endfor %}
</table>

<div style="text-align: center; margin: 30px;">
    <a href="{% url 'dashboard' %}" class="back">
        🏠 Back to Dashboard
    </a>
</div>

</body>
</html>
