 <!DOCTYPE html>
<html>
<head>
    <title>Add Sale</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .sale-box {
            max-width: 450px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #555;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="sale-box">

    <h1>🛒 Add Sale</h1>

    {% if error %}
        <p style="color: red; text-align: center;">
            ⚠️ {{ error }}
        </p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Select Product</label>

        <select name="product" required>
            <option value="">-- Select Product --</option>

            {% for product in products %}
                <option value="{{ product.id }}">
                    {{ product.name }} (Stock: {{ product.quantity }})
                </option>
            {% endfor %}
        </select>

        <label>Quantity</label>

        <input
            type="number"
            name="quantity"
            min="1"
            required
            placeholder="Enter quantity"
        >

        <button type="submit">
            🛒 Record Sale
        </button>
    </form>

    <div style="text-align: center;">
        <a href="{% url 'dashboard' %}" class="back">
            🏠 Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
