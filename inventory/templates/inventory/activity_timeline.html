<!DOCTYPE html>
<html>
<head>
    <title>Activity Timeline</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
        }

        .timeline {
            width: 90%;
            max-width: 800px;
            margin: auto;
        }

        .activity {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #3498db;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .activity-title {
            font-size: 18px;
            font-weight: bold;
        }

        .activity-info {
            margin-top: 8px;
            color: #555;
        }

        .activity-date {
            margin-top: 8px;
            font-size: 13px;
            color: #888;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<h1>🕒 Activity Timeline</h1>

<div class="timeline">

    {% for sale in sales %}

    <div class="activity">

        <div class="activity-title">
            🛒 Sale Recorded
        </div>

        <div class="activity-info">
            <strong>{{ sale.product.name }}</strong>
            — {{ sale.quantity }} unit(s) sold
        </div>

        <div class="activity-info">
            Total Price: ₹{{ sale.total_price }}
        </div>

        <div class="activity-date">
            {{ sale.sale_date|date:"d M Y, h:i A" }}
        </div>

    </div>

    {% empty %}

    <div class="empty">
        No activity recorded yet.
    </div>

    {% endfor %}

    <div style="text-align: center;">
        <a href="{% url 'dashboard' %}" class="back">
            🏠 Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
