<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .profile-box {
            max-width: 400px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            text-align: center;
        }

        .profile-icon {
            font-size: 60px;
        }

        .info {
            text-align: left;
            margin: 25px 0;
        }

        .info p {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .back {
            display: inline-block;
            padding: 10px 18px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="profile-box">

    <div class="profile-icon">👤</div>

    <h1>My Profile</h1>

    <div class="info">
        <p>
            <strong>Username:</strong>
            {{ user.username }}
        </p>

        <p>
            <strong>Email:</strong>
            {{ user.email|default:"Not provided" }}
        </p>
    </div>
    <a href="{% url 'edit_profile' %}"
    class="back"
    style="margin-bottom: 10px;">
    ✏️ Edit Profile
    <a href="{% url 'change_password' %}"
   class="back"
   style="margin-bottom: 10px;">
    🔑 Change Password
</a>
</a>
    <a href="{% url 'dashboard' %}" class="back">
        🏠 Back to Dashboard
    </a>

</div>

</body>
</html>
