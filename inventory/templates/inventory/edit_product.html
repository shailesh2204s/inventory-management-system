<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 30px;
        }

        .form-box {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>Edit Product</h1>

<form method="POST">
    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name" value="{{ product.name }}"><br><br>

    <label>Category:</label>
    <input type="text" name="category" value="{{ product.category }}"><br><br>

    <label>Price:</label>
    <input type="number" name="price" step="0.01" min="0" value="{{ product.price }}">
    <label>Quantity:</label>
    <input type="number" name="quantity" min="0" value="{{ product.quantity }}">

    <label>Supplier:</label>
    <input type="text" name="supplier" value="{{ product.supplier }}"><br><br>

    <button type="submit">Update Product</button>
</form>

<br>

<a href="{% url 'products' %}">Back to Products</a>

</body>
</html>
